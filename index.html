<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffffff" />

  <title>미리 메리 크리스마스</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #161616;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* 첫 화면 */
    .hero {
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 16px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* 카드 */
    .card {
      width: min(100%, 480px);
      width: min(100%, 480px, calc((100svh - 160px) * 0.6992));
      aspect-ratio: 1016 / 1453;
      flex-shrink: 0;

      position: relative;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;

      perspective: 1600px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .card:focus-visible,
    a:focus-visible {
      outline: 3px solid #003cff;
      outline-offset: 6px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.22, 0.7, 0.22, 1);
    }

    .card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: block;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      transform: rotateY(0deg);
    }

    .card-back {
      transform: rotateY(180deg);
      background: #ff008c;
    }

    .card-face img {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 보내준 뒷면 파일의 오른쪽·아래 회색 여백 제외 */
    .card-back img {
      width: calc(100% * 1369 / 1017);
      height: calc(100% * 1684 / 1453);
    }

    .hint {
      margin: 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .scroll-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 16px;
      color: #161616;
      font-size: 13px;
      text-decoration: none;
    }

    /* 스크롤 아래 안내 */
    .details {
      width: min(100%, 528px);
      margin: 0 auto;
      padding: 72px 24px 100px;
      scroll-margin-top: 24px;
    }

    .intro {
      margin-bottom: 64px;
    }

    .intro h1 {
      margin: 0 0 24px;
      font-size: clamp(25px, 6.5vw, 34px);
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .intro p {
      margin: 0;
      color: #ff008c;
      font-size: 16px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .info-item {
      padding: 28px 0 32px;
      border-top: 1px solid #dedede;
    }

    .info-item h2 {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 700;
      color: #ff008c;
    }

    .info-item p {
      margin: 0;
      font-size: 17px;
      line-height: 1.85;
      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    .info-item .note {
      margin-top: 12px;
      color: #666;
      font-size: 15px;
    }

    .info-item .place-name {
      margin-bottom: 6px;
      font-size: 23px;
      font-weight: 700;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 48px;
      margin-top: 22px;
      padding: 12px 18px;

      border: 1px solid #161616;
      color: #161616;
      font-size: 14px;
      text-decoration: none;
    }

    @media (hover: hover) {
      .map-link:hover {
        background: #161616;
        color: #fff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .card-inner {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>

    <!-- 첫 화면: 터치하면 뒤집히는 초대장 -->
    <section class="hero" aria-label="초대장">
      <button
        class="card"
        type="button"
        aria-label="초대장 뒷면 보기"
        aria-pressed="false"
        aria-describedby="hint"
      >
        <span class="card-inner">
          <span class="card-face card-front">
            <img
              src="./front.png"
              alt="크리스마스트리와 선물이 담긴 초대장 앞면"
              draggable="false"
            />
          </span>

          <span class="card-face card-back" aria-hidden="true">
            <img
              src="./back.png"
              alt="미리 메리 크리스마스에 초대합니다. 2026년 11월 15일 오후 6시부터. 드레스코드: 크리스마스."
              draggable="false"
            />
          </span>
        </span>
      </button>

      <p class="hint" id="hint" aria-live="polite">
        초대장을 터치해서 뒤집어보세요
      </p>

      <a class="scroll-link" href="#details">
        아래로 내려 자세히 보기 <span aria-hidden="true">↓</span>
      </a>
    </section>

    <!-- 두 번째 화면: 파티 안내 -->
    <section class="details" id="details" aria-labelledby="invitation-title">

      <div class="intro">
        <h1 id="invitation-title">
          11월 15일,<br />
          미리 하는 크리스마스 파티에<br />
          당신을 초대합니다.
        </h1>

        <p>
          우리가 있는 그곳이<br />
          바로 크리스마스…….
        </p>
      </div>

      <section class="info-item">
        <h2>준비물</h2>

        <p>
          당신의 크리스마스를 뽐내줄 옷과<br />
          2만 원 내외의 선물을 준비해주세요.
        </p>

        <p class="note">
          선물 교환식이 있을 예정입니다.
        </p>
      </section>

      <section class="info-item">
        <h2>장소</h2>

        <p class="place-name">신촌응접실</p>

        <p>
          서울 마포구 신촌로20길 23, 지층
        </p>

        <a
          class="map-link"
          href="https://map.naver.com/p/search/서울%20마포구%20신촌로20길%2023"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="네이버지도에서 장소 확인하기, 새 창"
        >
          네이버지도에서 보기 <span aria-hidden="true">↗</span>
        </a>
      </section>

      <section class="info-item">
        <h2>시간</h2>

        <p>
          2026년 11월 15일<br />
          오후 6시부터
        </p>
      </section>

    </section>
  </main>

  <script>
    const card = document.querySelector(".card");
    const front = document.querySelector(".card-front");
    const back = document.querySelector(".card-back");
    const hint = document.querySelector(".hint");

    card.addEventListener("click", () => {
      const flipped = card.classList.toggle("is-flipped");

      card.setAttribute("aria-pressed", String(flipped));
      card.setAttribute(
        "aria-label",
        flipped ? "초대장 앞면 보기" : "초대장 뒷면 보기"
      );

      front.setAttribute("aria-hidden", String(flipped));
      back.setAttribute("aria-hidden", String(!flipped));

      hint.textContent = flipped
        ? "다시 터치하면 앞면으로 돌아가요"
        : "초대장을 터치해서 뒤집어보세요";
    });
  </script>
</body>
</html>
